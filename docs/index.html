<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Rock-paper-scissors on Sui</title>
  <style>
    body{background:#000;color:#fff;font-family:monospace;margin:0;padding:20px;text-align:center}
    .player{border:2px solid #d11;display:inline-block;padding:6px 12px;margin:8px}
    .btn{background:#d11;color:#fff;border:none;padding:10px 16px;margin:6px;font-weight:bold;cursor:pointer}
    input,select{padding:8px;margin:6px;background:#111;color:#fff;border:1px solid #222}
    @keyframes pulse{from{transform:scale(1);opacity:.7}to{transform:scale(1.06);opacity:1}}
    .note{color:#f77;margin:12px 0}
  </style>
</head>
<body>
  <h1>Rock-paper-scissors on Sui</h1>
  <div><div class="player">Player 1</div><div class="player">Player 2</div></div>

  <div>
    <button class="btn" id="create">Create Game (testnet)</button>
    <input id="gameId" placeholder="Game Object ID"/>
    <button class="btn" id="join">Join Game</button>
  </div>

  <div>
    <select id="move">
      <option value="0">Rock</option>
      <option value="1">Paper</option>
      <option value="2">Scissors</option>
    </select>
    <input id="secret" placeholder="Secret"/>
    <button class="btn" id="commit">Commit</button>
    <button class="btn" id="reveal">Reveal</button>
  </div>

  <div>
    <button class="btn" id="check">Check Winner</button>
    <button class="btn" id="demo">Play-for-fun Demo (local)</button>
    <button class="btn" id="claim">Claim Timeout</button>
  </div>

  <div class="note">On-chain actions need a Sui wallet. Replace PACKAGE_ID after publishing the Move package.</div>
  <div class="status" id="status">Ready</div>
  <div class="result" id="result"></div>

  <script type="module" src="https://cdn.jsdelivr.net/npm/@wallet-standard/core@1.1.1/lib/esm/index.js"></script>
  <script type="module">
  /* Minimal wallet-agnostic client, one-of-each definitions */

  // ---- Config ----
  const FULLNODE = "https://fullnode.testnet.sui.io";
  const PACKAGE_ID = "0x78da54752b8cca732c97602c9488ebf54e106b926682530b34e8e0c7a3c3d103"; // <-- your real package id
  const MODULE = "rps_commit_reveal";
  const CLOCK_ID = "0x6";

  // ---- UI helpers ----
  const statusEl = document.getElementById("status");
  const resultEl = document.getElementById("result");
  const setStatus = (m) => (statusEl.textContent = m);
  const setResult = (m) => (resultEl.textContent = m);
  const gid = () => document.getElementById("gameId").value.trim();
  const gmv = () => Number(document.getElementById("move").value);
  const gsc = () => document.getElementById("secret").value;

  // ---- JSON-RPC helper (read-only) ----
  async function rpc(method, params) {
    const res = await fetch(FULLNODE, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params }),
    });
    const j = await res.json();
    if (j.error) throw new Error(j.error.message || "RPC error");
    return j.result;
  }

  // ---- Keccak256 (real) ----
  const { keccak_256 } = await import("https://esm.sh/@noble/hashes@1.5.0/sha3");
  const commitBytes = (m, s) => {
    const enc = new TextEncoder();
    const data = new Uint8Array(1 + enc.encode(s).length);
    data[0] = m & 0xff;
    data.set(enc.encode(s), 1);
    return Array.from(keccak_256(data));
  };

  // ---- Wallet detection + permissioning ----
  function getWallet() {
    return (
      window.suiWallet ||          // Sui Wallet (Mysten)
      window.suiet ||              // Suiet
      window.ethos?.wallet ||      // Ethos
      window.martian ||            // Martian
      window.onekey?.sui ||        // OneKey Sui
      window.wallet ||             // generic
      null
    );
  }
  let wallet = getWallet();

  async function ensureWallet() {
    wallet = getWallet();
    if (!wallet) {
      setStatus("No Sui wallet detected. Install Sui Wallet or Suiet and enable it on this site.");
      return false;
    }
    try { await wallet.requestPermissions?.(); } catch {}
    return true;
  }

  async function myAddress() {
    if (!(await ensureWallet())) return null;
    const a = await wallet?.getAccounts?.();
    return a?.[0]?.address ?? null;
  }

  // ---- Tx helper supporting modern + legacy APIs ----
  async function sendMoveCall(moveFn, argKinds, argValues, gasBudget = 5_000_000) {
    if (!(await ensureWallet())) throw new Error("No Sui wallet detected.");

    // Modern API
    if (typeof wallet.signAndExecuteTransactionBlock === "function") {
      const { TransactionBlock } = await import("https://esm.sh/@mysten/sui/transactions");
      const tx = new TransactionBlock();
      const args = argValues.map((v, i) => (argKinds[i] === "object" ? tx.object(v) : tx.pure(v)));
      tx.moveCall({ target: `${PACKAGE_ID}::${MODULE}::${moveFn}`, arguments: args });
      return wallet.signAndExecuteTransactionBlock({
        transactionBlock: tx,
        options: { showEffects: true, showObjectChanges: true },
      });
    }

    // Legacy API
    if (typeof wallet.signAndExecuteTransaction === "function") {
      const tx = {
        kind: "moveCall",
        data: {
          packageObjectId: PACKAGE_ID,
          module: MODULE,
          function: moveFn,
          arguments: argValues,
          typeArguments: [],
          gasBudget,
        },
      };
      return wallet.signAndExecuteTransaction(tx);
    }

    throw new Error("Wallet does not support known Sui APIs.");
  }

  // ---- Local demo (always works) ----
  document.getElementById("demo").onclick = () => {
    const a = gmv();
    const b = Math.floor(Math.random() * 3);
    const names = ["Rock", "Paper", "Scissors"];
    const out = a === b ? 0 : ((a === 0 && b === 2) || (a === 1 && b === 0) || (a === 2 && b === 1)) ? 1 : -1;
    setStatus(`You: ${names[a]} vs Bot: ${names[b]}`);
    setResult(out === 0 ? "Draw" : out > 0 ? "You win!" : "You lose");
  };

  // ---- Create (u64, Clock object) ----
  document.getElementById("create").onclick = async () => {
    try {
      setStatus("Creating game...");
      const res = await sendMoveCall("create_game", ["pure", "object"], [60000, CLOCK_ID], 10_000_000);
      let gameId = "";
      for (const ch of res?.objectChanges ?? []) {
        if (ch.type === "created" && ch.objectType?.endsWith(`::${MODULE}::Game`)) { gameId = ch.objectId; break; }
      }
      if (gameId) { document.getElementById("gameId").value = gameId; setStatus(`Created game: ${gameId}`); }
      else setStatus("Created. Open your wallet activity and copy the Game object ID.");
    } catch (e) { console.error(e); setStatus("Create failed: " + (e.message || e)); }
  };

  // ---- Join (Game object, address, Clock object) ----
  document.getElementById("join").onclick = async () => {
    const id = gid(); if (!id) return setStatus("Enter Game Object ID");
    try {
      const addr = await myAddress(); if (!addr) return;
      await sendMoveCall("join_game", ["object", "pure", "object"], [id, addr, CLOCK_ID]);
      setStatus("Joined. Commit your move.");
    } catch (e) { console.error(e); setStatus("Join failed: " + (e.message || e)); }
  };

  // ---- Commit (Game object, address, vector<u8>) ----
  document.getElementById("commit").onclick = async () => {
    const id = gid(); if (!id) return setStatus("Enter Game Object ID");
    const s = gsc(); if (!s) return setStatus("Enter a secret");
    try {
      const addr = await myAddress(); if (!addr) return;
      const commitment = commitBytes(gmv(), s);
      await sendMoveCall("commit_move", ["object", "pure", "pure"], [id, addr, commitment]);
      setStatus("Committed.");
    } catch (e) { console.error(e); setStatus("Commit failed: " + (e.message || e)); }
  };

  // ---- Reveal (Game object, address, u8, vector<u8>) ----
  document.getElementById("reveal").onclick = async () => {
    const id = gid(); if (!id) return setStatus("Enter Game Object ID");
    const s = gsc(); if (!s) return setStatus("Enter a secret");
    try {
      const addr = await myAddress(); if (!addr) return;
      const secretBytes = Array.from(new TextEncoder().encode(s));
      await sendMoveCall("reveal_move", ["object", "pure", "pure", "pure"], [id, addr, gmv(), secretBytes]);
      setStatus("Revealed.");
    } catch (e) { console.error(e); setStatus("Reveal failed: " + (e.message || e)); }
  };

  // ---- Claim timeout (Game object, Clock object, address) ----
  document.getElementById("claim").onclick = async () => {
    const id = gid(); if (!id) return setStatus("Enter Game Object ID");
    try {
      const addr = await myAddress(); if (!addr) return;
      await sendMoveCall("claim_timeout", ["object", "object", "pure"], [id, CLOCK_ID, addr]);
      setStatus("Timeout claimed (if eligible).");
    } catch (e) { console.error(e); setStatus("Claim failed: " + (e.message || e)); }
  };

  // ---- Check winner (read-only) ----
  document.getElementById("check").onclick = async () => {
    const id = gid(); if (!id) return setStatus("Enter Game Object ID");
    try {
      const o = await rpc("sui_getObject", [{ id, options: { showContent: true } }]);
      const f = o?.data?.content?.fields;
      const w = f?.winner;
      setResult(w && w !== "0x0" ? `Winner: ${w}` : "Draw or pending...");
    } catch (e) { console.error(e); setStatus("Fetch failed: " + (e.message || e)); }
  };
</script>
</body>
</html>
