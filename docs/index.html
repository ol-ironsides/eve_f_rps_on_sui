<!doctype html>
<html>
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Rock-paper-scissors on Sui</title>
<style>
body{background:#000;color:#fff;font-family:monospace;margin:0;padding:20px;text-align:center}
.player{border:2px solid #d11;display:inline-block;padding:6px 12px;margin:8px}
.btn{background:#d11;color:#fff;border:none;padding:10px 16px;margin:6px;font-weight:bold;cursor:pointer}
input,select{padding:8px;margin:6px;background:#111;color:#fff;border:1px solid #222}
.status{color:#aaa;margin-top:10px}
.result{color:#d11;margin-top:12px;font-size:1.2em;animation:pulse 1.2s infinite alternate}
@keyframes pulse{from{transform:scale(1);opacity:.7}to{transform:scale(1.06);opacity:1}}
.note{color:#f77;margin:12px 0}
</style>
</head>
<body>
<h1>Rock-paper-scissors on Sui</h1>
<div><div class="player">Player 1</div><div class="player">Player 2</div></div>
<div>
  <button class="btn" id="create">Create Game (testnet)</button>
  <input id="gameId" placeholder="Game Object ID"/>
  <button class="btn" id="join">Join Game</button>
</div>
<div>
  <select id="move"><option value="0">Rock</option><option value="1">Paper</option><option value="2">Scissors</option></select>
  <input id="secret" placeholder="Secret"/>
  <button class="btn" id="commit">Commit</button>
  <button class="btn" id="reveal">Reveal</button>
</div>
<div>
  <button class="btn" id="check">Check Winner</button>
  <button class="btn" id="demo">Play-for-fun Demo (local)</button>
</div>
<div class="note">On-chain actions need a Sui wallet extension. Replace PACKAGE_ID in this file after you publish the Move package.</div>
<div class="status" id="status">Ready</div>
<div class="result" id="result"></div>
<script type="module">
  import { SuiClient, getFullnodeUrl } from "https://esm.sh/@mysten/sui.js@0.34.0/client";
  import { keccak_256 } from "https://esm.sh/@noble/hashes@1.5.0/sha3";
  const client = new SuiClient({ url: getFullnodeUrl('testnet') });
  const PACKAGE_ID = "0xYOUR_PACKAGE_ID";
  const MODULE = "rps_commit_reveal";
  const status = document.getElementById('status'); const result = document.getElementById('result');
  const wallet = window.suiWallet || window.wallet;
  const setStatus = (m)=> status.textContent = m; const setResult = (m)=> result.textContent = m;
  const gid = ()=> document.getElementById('gameId').value.trim();
  const gmv = ()=> Number(document.getElementById('move').value);
  const gsc = ()=> document.getElementById('secret').value;
  const commit = (m,s)=> Array.from(keccak_256(new Uint8Array([m, ...new TextEncoder().encode(s)])));
  document.getElementById('create').onclick = async ()=>{
    if(!wallet) return setStatus('Install Sui Wallet to create a game.');
    try{ await wallet.requestPermissions(); setStatus('Creating...');
      const tx={kind:'moveCall',data:{packageObjectId:PACKAGE_ID,module:MODULE,function:'create_game',arguments:[60000]}};
      await wallet.signAndExecuteTransaction(tx); setStatus('Created. Check wallet activity for object ID.');
    }catch(e){console.error(e); setStatus('Create failed');}
  };
  document.getElementById('join').onclick = async ()=>{
    if(!wallet) return setStatus('Install Sui Wallet to join.');
    const id=gid(); if(!id) return setStatus('Enter Game Object ID');
    try{ await wallet.requestPermissions();
      const tx={kind:'moveCall',data:{packageObjectId:PACKAGE_ID,module:MODULE,function:'join_game',arguments:[id]}};
      await wallet.signAndExecuteTransaction(tx); setStatus('Joined. Commit your move.');
    }catch(e){console.error(e); setStatus('Join failed');}
  };
  document.getElementById('commit').onclick = async ()=>{
    if(!wallet) return setStatus('Install Sui Wallet to commit.');
    const id=gid(); if(!id) return setStatus('Enter Game Object ID'); const s=gsc(); if(!s) return setStatus('Enter a secret');
    try{ await wallet.requestPermissions();
      const tx={kind:'moveCall',data:{packageObjectId:PACKAGE_ID,module:MODULE,function:'commit_move',arguments:[id, commit(gmv(), s)]}};
      await wallet.signAndExecuteTransaction(tx); setStatus('Committed.');
    }catch(e){console.error(e); setStatus('Commit failed');}
  };
  document.getElementById('reveal').onclick = async ()=>{
    if(!wallet) return setStatus('Install Sui Wallet to reveal.');
    const id=gid(); if(!id) return setStatus('Enter Game Object ID'); const s=gsc(); if(!s) return setStatus('Enter a secret');
    try{ await wallet.requestPermissions();
      const tx={kind:'moveCall',data:{packageObjectId:PACKAGE_ID,module:MODULE,function:'reveal_move',arguments:[id, gmv(), Array.from(new TextEncoder().encode(s))]}};
      await wallet.signAndExecuteTransaction(tx); setStatus('Revealed.');
    }catch(e){console.error(e); setStatus('Reveal failed');}
  };
  document.getElementById('check').onclick = async ()=>{
    const id=gid(); if(!id) return setStatus('Enter Game Object ID');
    try{ const o=await client.getObject({id,options:{showContent:true}}); const f=o?.data?.content?.fields; const w=f?.winner;
      setResult(w && w!=='0x0' ? 'Winner: '+w : 'Draw or pending...');
    }catch(e){console.error(e); setStatus('Fetch failed');}
  };
  document.getElementById('demo').onclick = ()=>{
    const a=gmv(); const b=Math.floor(Math.random()*3); const names=['Rock','Paper','Scissors'];
    const out = a===b?0:((a===0&&b===2)||(a===1&&b===0)||(a===2&&b===1))?1:-1;
    setStatus(`You: ${names[a]} vs Bot: ${names[b]}`); setResult(out===0?'Draw':(out>0?'You win!':'You lose'));
  };
</script>
</body>
</html>
